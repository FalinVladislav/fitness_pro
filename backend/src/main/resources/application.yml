spring:
  application:
    name: fitness-pro
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  booking:
    cancel-deadline-minutes: ${BOOKING_CANCEL_DEADLINE_MINUTES:120}

logging:
  level:
    com.fitnesspro: INFO
