spring:
  application:
    name: fitness-pro
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fitness_pro}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:fitness-pro-development-secret-key-please-change-32chars}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  booking:
    cancel-deadline-minutes: ${BOOKING_CANCEL_DEADLINE_MINUTES:120}

logging:
  level:
    com.fitnesspro: INFO
