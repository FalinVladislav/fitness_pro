services:
  postgres:
    image: postgres:16-alpine
    container_name: fitness-pro-postgres
    environment:
      POSTGRES_DB: fitness_pro
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
    ports:
      - "5433:5432"
    volumes:
      - fitness_pro_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitness -d fitness_pro"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  fitness_pro_pg:
